<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <script>
    // SPA fallback: ohjaa kaikki tuntemattomat polut index.html:ään
    // Tallennetaan alkuperäinen polku sessionStorageen ja ohjataan etusivulle
    var path = window.location.pathname;
    var search = window.location.search;
    sessionStorage.setItem('spa-redirect', path + search);
    window.location.replace('/');
  </script>
</head>
<body>
  <p>Ohjataan...</p>
</body>
</html>
