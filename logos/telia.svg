<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <rect width="200" height="100" rx="8" fill="white" stroke="#e8d5ff" stroke-width="1.5"/>
  <!-- Globe icon approximation -->
  <g transform="translate(28,50)">
    <!-- Outer ellipse (tilted) -->
    <ellipse cx="0" cy="0" rx="21" ry="27" fill="#990AE3" transform="rotate(-15)"/>
    <!-- White curved stripes -->
    <path d="M -18 -8 Q 0 -16 18 -8" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M -21 4 Q 0 -4 21 4" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M -17 16 Q 0 8 17 16" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Telia text -->
  <text x="118" y="60" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#990AE3" text-anchor="middle" letter-spacing="-0.5">Telia</text>
</svg>
